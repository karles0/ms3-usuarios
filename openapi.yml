openapi: 3.0.0
info:
  title: MS3 - Usuarios API
  version: 1.0.0
servers:
  - url: http://localhost:8003/api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: Sistema
    description: Endpoints de operación básica
  - name: Autenticación
    description: Registro e inicio de sesión
  - name: Usuarios
    description: Gestión de usuarios (requiere token)
paths:
  /health:
    get:
      summary: Verifica que la API esté disponible
      tags:
        - Sistema
      responses:
        '200':
          description: API funcionando correctamente
  /usuarios/signup:
    post:
      summary: Crear una nueva cuenta (Registro)
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - apellido
                - email
                - contraseña
              properties:
                nombre:
                  type: string
                  example: Carlos
                apellido:
                  type: string
                  example: García
                email:
                  type: string
                  example: carlos@email.com
                password:
                  type: string
                  example: mi_password_123
                telefono:
                  type: string
                  example: '999888777'
      responses:
        '201':
          description: Usuario creado exitosamente con su token
        '400':
          description: Email ya en uso o datos inválidos
  /usuarios/login:
    post:
      summary: Iniciar sesión
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - contraseña
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login exitoso, devuelve el token JWT
        '401':
          description: Credenciales incorrectas
  /usuarios:
    get:
      summary: Lista usuarios con paginación
      tags:
        - Usuarios
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de usuarios
        '401':
          description: No autorizado
  /usuarios/{id}:
    get:
      summary: Obtener perfil de un usuario
      tags:
        - Usuarios
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario encontrado
        '401':
          description: No autorizado
        '404':
          description: Usuario no encontrado
    delete:
      summary: Eliminar cuenta de usuario (solo admin)
      tags:
        - Usuarios
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Usuario eliminado
        '403':
          description: No autorizado (no eres admin)
        '404':
          description: Usuario no encontrado
  /usuarios/{id}/direccion:
    put:
      summary: Actualizar dirección del usuario
      tags:
        - Usuarios
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                direccion:
                  type: object
                  properties:
                    calle:
                      type: string
                    ciudad:
                      type: string
                    pais:
                      type: string
      responses:
        '200':
          description: Dirección actualizada
        '401':
          description: No autorizado
        '404':
          description: Usuario no encontrado
  /usuarios/{id}/rol:
    patch:
      summary: Asignar rol a un usuario (solo admin)
      tags:
        - Usuarios
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rol
              properties:
                rol:
                  type: string
                  enum:
                    - user
                    - admin
      responses:
        '200':
          description: Rol actualizado
        '403':
          description: No autorizado (no eres admin)
        '404':
          description: Usuario no encontrado
